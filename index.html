<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake-on-LAN</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #1e1e1e; padding: 40px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        h1 { margin-top: 0; font-size: 1.5rem; color: #e0e0e0; }
        .device { margin-bottom: 20px; font-size: 1.2rem; color: #aaaaaa; }
        button { background-color: #007bff; color: white; border: none; padding: 16px 32px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; width: 100%; box-sizing: border-box; }
        button:hover { background-color: #0056b3; }
        button:active { background-color: #004085; transform: scale(0.98); }
        .status { margin-top: 20px; min-height: 24px; font-size: 0.9rem; color: #4caf50; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wake-on-LAN</h1>
        <div class="device">MyPC</div>
        <button id="wakeBtn">Wake Up</button>
        <div id="status" class="status"></div>
    </div>
    <script>
        document.getElementById('wakeBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            const btn = document.getElementById('wakeBtn');
            btn.disabled = true;
            btn.style.opacity = '0.7';
            statusEl.textContent = 'Sending magic packet...';
            statusEl.className = 'status';
            try {
                const response = await fetch('/wake', { method: 'POST' });
                if (response.ok) {
                    statusEl.textContent = 'Magic packet sent successfully!';
                } else {
                    throw new Error('Server error');
                }
            } catch (err) {
                statusEl.textContent = 'Failed to send packet.';
                statusEl.className = 'status error';
            }
            setTimeout(() => { btn.disabled = false; btn.style.opacity = '1'; }, 2000);
        });
    </script>
</body>
</html>
